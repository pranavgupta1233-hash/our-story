<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Story 💞</title><style>body{margin:0;background:#fff1f5;font-family:Georgia,serif;color:#5a3040;display:flex;justify-content:center;align-items:center;min-height:100vh}.book{width:min(92vw,850px);height:min(86vh,620px);position:relative;perspective:1800px}.page{position:absolute;inset:0;background:#fffafc;border:2px solid #d8a9b9;border-radius:18px;box-shadow:0 12px 35px #8b536633;padding:55px 65px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;transform-origin:left center;transition:transform .8s;backface-visibility:hidden}.page h1{font-size:clamp(27px,4vw,43px);margin:0 0 28px}.page p{font-size:clamp(17px,2.1vw,24px);line-height:1.65;white-space:pre-line;margin:0}.page.flipped{transform:rotateY(-180deg)}.controls{position:fixed;bottom:25px;display:flex;gap:15px}.controls button{border:0;border-radius:25px;padding:12px 24px;background:#9b5570;color:white;font-size:16px;cursor:pointer}.counter{position:fixed;top:18px;color:#8b5366}</style></head><body><div class="book" id="book"></div><div class="counter" id="counter"></div><div class="controls"><button onclick="prev()">← Back</button><button onclick="next()">Next →</button></div><script>const slides=[
['OUR STORY 💞','From strangers → friends → best friends → someone truly special.\n\n2 July 2025 → now\n\nA little timeline of all the moments I never want to forget.'],
['2 JULY 2025 — THE FIRST SIGHT 👀','The day I first saw you.\nI had no idea then how important you would become in my life.\n\nFunny how one normal day can quietly become the beginning of something so special.'],
['4 JULY 2025 — FIRST MEETING 🥹','Our first proper meeting.\nStill just two people who barely knew what was coming next.\n\nAnd then came 12 July — our first message, for work. 😂'],
['26 JULY — FIRST CHOCOLATE 🍫','Happiness Dairy Milk Silk.\nMy first ever chocolate from a girl. 😭😂\n\nI still remember that happiness.'],
['16 AUGUST — YOUR DIARY 📖','You gave me your diary for the first time.\nLater you told me you wrote because you knew I liked reading it.\n\nThat little thing meant more than you probably realised. 💞'],
['7 SEPTEMBER — CHHOTI BACCHI 😂','7 September was when I officially declared your name as “chhoti bacchi”. 😂\n\nAnd honestly… after everything that happened later, the name became pretty accurate. 😭😂'],
['SEPTEMBER — THE TRIP STORY 🚌','13–14 September: trip discussions started.\n20 September: I said no. 😭\n21 September: you scolded me for not going and even gave me your kasam. 😂😭\n\nAnd then… 28 September — WE WERE ON THE TRIP! 🥳🥳'],
['28 SEPTEMBER — THE TRIP 🥳','We enjoyed A LOT.\nThe dance party, all the fun, all the chaos… and your poor white clothes. 😂\n\nI still remember removing food from your white clothes multiple times. 😭😂'],
['1 OCTOBER 2025 — YOUR BIRTHDAY 🎂','I planned so much… and then the snow spray happened. 😭😂\n\nBut I did keep one promise: I was the FIRST one to wish you. 🥳😁\n\nA 5–10 minute call, but a memory I’ll always keep.'],
['THE TRIP ENDED… BUT SOMETHING STARTED 💞','That day I ate cake after 2–3 years, just because of you.\n\nSometimes the smallest moments become the biggest memories.'],
['3 OCTOBER — CHOCOLATE NO. 3 🍫','You gave chocolate to Modi instead of me… just to make me jealous. 😂\n\nI DID get jealous. 😭\nBut then you gave me a Dairy Milk too. 🥳\n\nThird chocolate from my favourite person. 💞'],
['14–21 NOVEMBER — EXHIBITION 🎪','14 November: our groups changed and we came into the same group.\nWe prepared together for 21 November.\n\nAnd then came the concert.\n21 November — we enjoyed a LOT. 🥳😁'],
['17–18 DECEMBER — FAREWELL 💃','17 December: farewell.\nYes, I was jealous of Devansh and you dancing together. 😂👉🏻👈🏻\n\n18 December: Activa, LOC, VDN, lots of fun.\nHonestly… one of the BEST days. 💞'],
['FRIENDS → BEST FRIENDS 🫶','18 December changed something for me.\nOur friendship became much more than just normal friendship.\n\nYou became my best friend.\nAnd slowly, you became one of the most special people in my life. 💞'],
['27 DECEMBER — THE CRUSH QUESTION 😂','You asked me if you were my crush… because you saw Modi’s phone and my name saved there as an “S” lover name. 😂😭\n\nAnd then came the legendary “i love you meri jaan” moment. 😂😂'],
['27 DECEMBER — LATE NIGHT TALKS 🌙','Our first proper late-night talk, till around 1–2 AM. 😂\n\nOne of those nights where time just disappeared because talking to you was too much fun.'],
['JANUARY → 10 MARCH — OUR ERA 🥳','January onwards… we enjoyed A LOT.\nChats. Calls. Videos. Trends. Cringe. Comedy. Everything. 😂🥳\n\nYou did trends for me, I did them for you.\nSome were cringe… but every single one is memorable.'],
['YOU CHANGED ME 💞','Somewhere along the way, you changed me for the better.\n\nRegular calls, endless chats, random videos, jokes and little moments became part of my everyday life.\n\nI’m genuinely grateful for that.'],
['11 MARCH — DIFFERENT SECTIONS, SAME BOND 📞','Even after our sections became different, the calls continued. 😂\n\nWe still found our way back to talking, laughing and enjoying time together.'],
['12TH CLASS… AND SLOWER DAYS 😔','After that, chats and calls slowly became less frequent.\n12th got busy. Life got busy. 😔🥺\n\nI did get sad… but it’s okay.\nAs long as I have you keeping a check on me… 😜😁\nI’ll keep a check on you too.'],
['A LOT OF MOMENTS… 💭','There are honestly SO many more moments I could write about.\n\nLittle jokes. Random calls. Trips. Arguments. Chocolate. Late-night talks. Cringe trends.\n\nMemories that may sound ordinary to everyone else… but mean a lot to me.'],
['FROM STRANGERS TO SOMETHING SPECIAL 💞','2 July 2025 — I first saw you.\n4 July — first meeting.\n12 July — first message.\nAnd somehow, all those small moments became a friendship I never expected.\n\nStrangers → friends → best friends → one of the most special people in my life.'],
['TO MY FAVOURITE PERSON 💞','Thank you for every laugh, every call, every chocolate, every trip, every scolding, every silly moment and every memory.\n\nYou’ve become a very special part of my life.\n\nI loveee youuuu 💞💞💞 a lott.\n\n— Pranav']];
let i=0;const book=document.getElementById('book');slides.forEach((s,n)=>{let d=document.createElement('section');d.className='page';d.style.zIndex=slides.length-n;d.innerHTML='<h1>'+s[0]+'</h1><p>'+s[1]+'</p>';book.appendChild(d)});const pages=[...document.querySelectorAll('.page')];function render(){pages.forEach((p,n)=>p.classList.toggle('flipped',n<i));document.getElementById('counter').textContent=(i+1)+' / '+slides.length}function next(){if(i<pages.length)i++;render()}function prev(){if(i>0)i--;render()}render();</script></body></html>
